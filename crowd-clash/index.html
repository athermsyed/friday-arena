<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crowd Clash</title>
<meta name="description" content="Crowd Clash: a live party game for big groups. Real faces on fighter bodies, action quiz rounds, knockouts, tug of war and a dance-off.">
<meta name="theme-color" content="#0c1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: control bar, game map, then a play area with the projector screen (16:9) beside a player's phone. Reference sections follow. */
:root{
  --stage:#061a36; --stage-2:#0b2547; --panel:#0e2f5a; --panel-2:#16407a;
  --line:rgba(255,255,255,.12); --fg:#f2f7ff; --muted:#a9c3e0;
  --red:#ff3d6e; --blue:#009fdb; --gold:#ffb81c; --lime:#7be07f; --violet:#0057b8; --ink:#1a1430;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --util:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--stage)}
body{background:var(--stage);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-family:var(--util);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;font-size:14px;color:var(--blue)}
header.top{padding-block:28px 14px}
header.top h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,54px);line-height:1}
header.top h1 span{color:var(--red)}
header.top p{color:var(--muted);max-width:70ch;margin-top:8px}

/* controls */
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,16,48,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--stage)}
.ctrl .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.cbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.cbtn.main{background:var(--gold);color:#1b1640;border-color:var(--gold)}
.cbtn[aria-pressed="true"]{background:var(--gold);color:#1b1640;border-color:var(--gold)}
.scount{font-family:var(--util);font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp .lab{font-family:var(--util);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--muted)}
.vchip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 10px 4px 4px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.vchip img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel-2)}
.vchip small{color:var(--muted);font-weight:500}
.vchip[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-2)}
.spacer{flex:1}

/* game map */
.map{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:thin}
.mchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;text-align:left;min-width:108px}
.mchip b{display:block;font-family:var(--util);font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:14px;line-height:1.1}
.mchip small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.mchip.on{border-color:var(--gold);background:var(--panel-2)}
.mchip.done{opacity:.6}

/* play area */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;padding-block:12px 30px}
@media (max-width:900px){.play{grid-template-columns:1fr}.phonecol{justify-self:center}}
.tvlabel,.plabel{font-family:var(--util);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.tvframe{border:10px solid #23295f;border-radius:16px;background:#070a22;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.tv{position:relative;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;font-size:1.45cqw;
  background:radial-gradient(ellipse 50% 70% at 50% 110%,rgba(34,195,243,.25),transparent 70%),radial-gradient(ellipse 30% 50% at 10% 0%,rgba(255,61,110,.22),transparent 70%),radial-gradient(ellipse 30% 50% at 90% 0%,rgba(255,207,63,.16),transparent 70%),linear-gradient(180deg,#0d2e5c,#061a36)}
.tv.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1cqw,.6cqw)}40%{transform:translate(.9cqw,-.7cqw)}60%{transform:translate(-.6cqw,.4cqw)}80%{transform:translate(.4cqw,-.2cqw)}}
.cap{margin-top:14px;display:grid;gap:4px}
.cap h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.6vw,28px)}
.cap p{color:var(--muted);max-width:80ch}
.cap .who{color:var(--fg)}

/* phone */
.phonecol{width:300px;max-width:100%}
.phone{width:280px;max-width:100%;aspect-ratio:9/18.6;border-radius:38px;border:9px solid #2c3478;background:#080b22;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);margin:0 auto}
.phone .notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:80px;height:18px;border-radius:12px;background:#2c3478;z-index:5}
.ph{position:absolute;inset:0;padding:34px 16px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ph.red{background:linear-gradient(180deg,#3a0f2c,#120a26)}
.ph.blue{background:linear-gradient(180deg,#0b2f52,#0a0f2c)}
.pt{font-family:var(--display);font-size:19px;line-height:1.1}
.ps{font-size:13px;color:var(--muted)}
.pbtn{border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;background:var(--red);color:#fff;width:100%}
.pbtn.alt{background:var(--panel-2)}
.pbtn.gold{background:var(--gold);color:#1b1640}
.pin{border:2px solid var(--blue);border-radius:12px;padding:10px 12px;font-weight:700;background:var(--panel);min-height:52px}
.pin small{display:block;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.caret{display:inline-block;width:2px;height:1em;background:var(--fg);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.ans button{border:0;border-radius:14px;font-weight:800;font-size:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s,opacity .2s;padding:6px}
.ans button b{font-family:var(--display);font-weight:400;font-size:22px}
.ans button.picked{outline:4px solid #fff;transform:scale(1.04)}
.ans.locked button:not(.picked){opacity:.3}
.big{font-family:var(--display);font-size:64px;line-height:1;text-align:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-family:var(--util);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel-2)}
.chip.g{background:var(--gold);color:#1b1640}.chip.r{background:var(--red)}.chip.b{background:var(--blue);color:#06233a}.chip.l{background:var(--lime);color:#0d2a10}
.pfig{width:150px;margin:0 auto}.pfig svg{width:100%;height:auto;display:block}
.bodygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;flex:1;padding-bottom:6px}
.bcell{position:relative;background:var(--panel);border-radius:10px;padding:2px;border:2px solid transparent}
.bcell svg{width:100%;height:auto;display:block}
.bcell.me{border-color:var(--gold);background:var(--panel-2)}
.bcell .tk{position:absolute;inset:0;background:rgba(8,11,34,.62);border-radius:8px;display:flex;align-items:flex-end;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding-bottom:3px;color:var(--muted)}
.bcell .nm{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:9px;font-weight:800;text-transform:uppercase}
.tap{width:190px;height:190px;border-radius:50%;border:0;font-family:var(--display);font-size:38px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 40px currentColor;transition:transform .06s}
.tap:active,.tap.hit{transform:translateY(6px) scale(.97)}
.pad{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;flex:1}
.pad button{border:0;border-radius:12px;background:var(--panel-2);font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 10px;text-align:left;border-bottom:4px solid rgba(0,0,0,.35)}
.pad button i{font-style:normal;font-family:var(--display);font-size:16px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.pad button.hit{transform:translateY(3px);border-bottom-width:1px;background:#33409a}
.react{display:flex;gap:8px;justify-content:center}
.react button{border:0;width:62px;height:62px;border-radius:50%;background:var(--panel-2);font-family:var(--display);font-size:13px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote button{border:3px solid transparent;border-radius:14px;background:var(--panel);padding:4px;display:grid;justify-items:center;font-weight:800;font-size:13px}
.vote button svg{width:100%;height:auto}
.vote button.sel{border-color:var(--gold)}
.timer{height:8px;border-radius:9px;background:var(--panel-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.dangerph{animation:dang .9s ease-in-out infinite}
@keyframes dang{50%{background:#5a0f26}}

/* TV elements (cq units) */
.tvin{position:absolute;inset:0;padding:2.4cqw 3cqw;display:flex;flex-direction:column;gap:1.4cqw}
.bar1{display:flex;justify-content:space-between;align-items:center;gap:1cqw;font-family:var(--util);font-weight:800;text-transform:uppercase;letter-spacing:.15cqw;font-size:1.9cqw}
.pill{background:var(--red);padding:.35cqw 1.3cqw;border-radius:99px;white-space:nowrap}
.pill.b{background:var(--blue);color:#06233a}.pill.g{background:var(--gold);color:#1b1640}.pill.v{background:var(--violet)}.pill.l{background:var(--lime);color:#0d2a10}.pill.d{background:var(--panel-2)}
.q{font-family:var(--display);font-size:3.2cqw;line-height:1.1;text-align:center;max-width:82%;margin:0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1cqw}
.opt{position:relative;border-radius:1.1cqw;padding:1.2cqw 1.8cqw;font-weight:800;font-size:2.1cqw;display:flex;align-items:center;gap:1.2cqw;overflow:hidden;transition:opacity .4s,transform .4s}
.opt b{font-family:var(--display);font-weight:400;font-size:2.1cqw;width:3.2cqw;height:3.2cqw;border-radius:.7cqw;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none;z-index:1}
.opt span{z-index:1}
.opt .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.opt .n{margin-left:auto;font-family:var(--display);font-weight:400;z-index:1;opacity:0;transition:opacity .3s}
.opts.rev .opt .n{opacity:1}
.opts.rev .opt:not(.ok){opacity:.38}
.opts.rev .opt.ok{transform:scale(1.03);box-shadow:0 0 0 .35cqw #fff,0 0 3cqw rgba(255,255,255,.6)}
.c0{background:#e2365f}.c1{background:#1c9bd0}.c2{background:#d99a12}.c3{background:#3faa5a}
.tbar{height:1cqw;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--red));transform-origin:left}
.strip{display:grid;grid-template-columns:repeat(9,6.6cqw);gap:0 .6cqw;align-items:end;justify-content:center;margin-top:auto}
.strip .m{width:100%;position:relative;transition:filter .3s,opacity .3s}
.strip .m svg{width:100%;height:auto;display:block}
.strip .m.wait{filter:grayscale(1) brightness(.6);opacity:.55}
.cnt{font-family:var(--util);font-weight:800;font-size:1.9cqw;text-align:center;letter-spacing:.1cqw}
.arena{display:grid;grid-template-columns:repeat(9,1fr);gap:.2cqw 0;align-items:end;margin-top:auto}
.fig{position:relative}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.fig .tg{position:absolute;left:50%;bottom:-.2cqw;transform:translateX(-50%);font-family:var(--util);font-weight:800;font-size:1.25cqw;letter-spacing:.08cqw;text-transform:uppercase;white-space:nowrap;background:rgba(8,11,34,.75);padding:0 .5cqw;border-radius:.4cqw}
.popn{position:absolute;font-family:var(--display);font-size:2.4cqw;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;-webkit-text-stroke:.12cqw var(--ink);animation:popf 1.7s cubic-bezier(.2,1.4,.4,1) forwards;z-index:30}
.popn.big{font-size:4.4cqw}
.popn.g{color:var(--gold)}.popn.l{color:var(--lime)}.popn.r{color:var(--red)}.popn.b{color:var(--blue)}.popn.w{color:#fff}
@keyframes popf{0%{transform:translate(-50%,-30%) scale(.2);opacity:0}18%{transform:translate(-50%,-80%) scale(1.25);opacity:1}35%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-200%) scale(.95);opacity:0}}
.banner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) rotate(-4deg);font-family:var(--display);font-size:6cqw;color:var(--gold);-webkit-text-stroke:.25cqw var(--ink);text-shadow:0 .5cqw 0 var(--red);white-space:nowrap;z-index:40;pointer-events:none;animation:bann 1.8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes bann{0%{transform:translate(-50%,-50%) scale(3) rotate(-4deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05) rotate(-4deg)}}
.banner.stay{animation:bannS .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes bannS{0%{transform:translate(-50%,-50%) scale(3) rotate(-4deg);opacity:0}100%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:fl .4s ease-out forwards;z-index:45}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.ticker{font-family:var(--display);font-variant-numeric:tabular-nums}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 2cqw;position:relative}
.row{display:grid;grid-template-columns:2.6cqw 4cqw minmax(0,1fr) 7cqw;gap:.8cqw;align-items:center;background:rgba(255,255,255,.06);border-radius:.8cqw;padding:.3cqw .8cqw;height:3.9cqw;transition:transform .9s cubic-bezier(.3,1.3,.5,1),background .4s}
.row .rk{font-family:var(--display);font-size:1.6cqw;color:var(--muted)}
.row img{width:3.6cqw;height:3.6cqw;object-fit:cover;object-position:top;border-radius:50%;border:.25cqw solid}
.row .nm{font-weight:800;font-size:1.7cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font-family:var(--display);font-size:1.9cqw;text-align:right}
.row.top{background:rgba(255,207,63,.18)}
.row.danger{background:rgba(255,61,110,.35);animation:dangerRow .8s ease-in-out infinite}
@keyframes dangerRow{50%{background:rgba(255,61,110,.6)}}
.row.out{opacity:.4}
.stagebg{position:absolute;inset:0;background:radial-gradient(ellipse 30% 70% at 30% 0%,rgba(255,255,255,.12),transparent 70%),radial-gradient(ellipse 30% 70% at 70% 0%,rgba(255,255,255,.1),transparent 70%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#1d2366,#0b0e2c);border-top:.35cqw solid var(--blue)}
.actor{position:absolute;bottom:9%;transform-origin:50% 90%}
.actor svg{width:100%;height:auto;display:block;overflow:visible}
.ghostrow{position:absolute;top:3%;right:3%;display:flex;gap:.4cqw}
.ghostrow .fig{width:5cqw}
.lower{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;display:flex;gap:1cqw;align-items:center;background:rgba(10,13,38,.88);border-left:.6cqw solid var(--red);padding:.8cqw 1.4cqw;border-radius:.6cqw;font-family:var(--util);font-weight:800;letter-spacing:.1cqw;text-transform:uppercase;font-size:1.9cqw;z-index:35}
.lower b{color:var(--gold)}
.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.split .side{position:relative}
.split .side.r{background:linear-gradient(90deg,rgba(255,61,110,.35),transparent)}
.split .side.b{background:linear-gradient(270deg,rgba(34,195,243,.35),transparent)}
.vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:9cqw;color:var(--gold);-webkit-text-stroke:.3cqw var(--ink);z-index:5}
.teamlab{position:absolute;top:4%;font-family:var(--display);font-size:3.4cqw}
.wheel{position:relative;width:21cqw;aspect-ratio:1;border-radius:50%;border:.6cqw solid #fff;box-shadow:0 0 3cqw rgba(0,0,0,.6)}
.wheel .spin{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.wheel .ptr{position:absolute;left:50%;top:-2.2cqw;transform:translateX(-50%);width:0;height:0;border-left:1.4cqw solid transparent;border-right:1.4cqw solid transparent;border-top:2.6cqw solid var(--gold);z-index:3;filter:drop-shadow(0 .3cqw 0 var(--ink))}
.wheel img.h{position:absolute;width:4.2cqw;height:4.2cqw;object-fit:cover;object-position:top;border-radius:50%;border:.25cqw solid #fff;background:#061a36}
.song{display:flex;align-items:center;gap:1.4cqw;background:rgba(255,255,255,.08);border-radius:1.2cqw;padding:.8cqw 1.6cqw;align-self:center}
.eq{display:flex;gap:.3cqw;align-items:flex-end;height:2.6cqw}
.eq i{width:.5cqw;background:var(--gold);border-radius:.2cqw;animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{0%{height:20%}100%{height:100%}}
.dfloor{position:absolute;left:0;right:0;bottom:0;height:22%;display:grid;grid-template-columns:repeat(12,1fr);perspective:30cqw}
.dfloor i{border:1px solid rgba(255,255,255,.1);animation:tile 1s steps(1) infinite}
@keyframes tile{0%{background:rgba(255,61,110,.35)}33%{background:rgba(34,195,243,.35)}66%{background:rgba(255,207,63,.3)}}
.beam{position:absolute;top:-10%;width:18%;height:120%;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sweepb 3s ease-in-out infinite alternate;transform-origin:50% 0;mix-blend-mode:screen}
@keyframes sweepb{0%{transform:rotate(-18deg)}100%{transform:rotate(18deg)}}
.mvname{position:absolute;top:20%;font-family:var(--display);font-size:2.8cqw;color:#fff;-webkit-text-stroke:.12cqw var(--ink);transform:translateX(-50%);white-space:nowrap;animation:mvn .9s ease-out forwards;z-index:30}
@keyframes mvn{0%{transform:translate(-50%,20%) scale(.4);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-40%) scale(1);opacity:0}}
.hype{position:absolute;bottom:26%;width:1.6cqw;height:40%;border-radius:1cqw;background:rgba(255,255,255,.1);overflow:hidden}
.hype i{position:absolute;left:0;right:0;bottom:0;height:10%;transition:height .5s}
.floaty{position:absolute;font-family:var(--display);font-size:2cqw;animation:floaty 2.2s ease-out forwards;pointer-events:none;z-index:25}

/* dance moves: jointed limbs plus whole body */
.fig.mv-armsup .j-armL{animation:mArmL .6s ease-in-out}.fig.mv-armsup .j-armR{animation:mArmR .6s ease-in-out}
@keyframes mArmL{50%{transform:rotate(150deg)}}@keyframes mArmR{50%{transform:rotate(-150deg)}}
.fig.mv-wave .j-armR{animation:mWaveA .9s ease-in-out}.fig.mv-wave .j-foreR{animation:mWaveF .9s ease-in-out}
@keyframes mWaveA{20%,80%{transform:rotate(-120deg)}}@keyframes mWaveF{20%,60%{transform:rotate(-40deg)}40%,80%{transform:rotate(30deg)}}
.fig.mv-kick .j-legR{animation:mKick .6s ease-out}.fig.mv-kick .j-shinR{animation:mKickS .6s ease-out}
@keyframes mKick{40%,60%{transform:rotate(-95deg)}}@keyframes mKickS{20%{transform:rotate(40deg)}50%{transform:rotate(0)}}
.fig.mv-disco .j-armR{animation:mDiscoR .8s ease-in-out}.fig.mv-disco .j-armL{animation:mDiscoL .8s ease-in-out}.fig.mv-disco svg{animation:mDiscoB .8s ease-in-out}
@keyframes mDiscoR{0%,100%{transform:rotate(0)}30%,50%{transform:rotate(-160deg)}70%{transform:rotate(-20deg)}}
@keyframes mDiscoL{30%,50%{transform:rotate(-10deg)}70%,90%{transform:rotate(60deg)}}
@keyframes mDiscoB{30%,50%{transform:translateX(3%) rotate(4deg)}70%,90%{transform:translateX(-3%) rotate(-4deg)}}
.fig.mv-robot .j-armL,.fig.mv-robot .j-armR{animation:mRobA .8s steps(4)}.fig.mv-robot .j-foreL{animation:mRobF .8s steps(4)}.fig.mv-robot .j-foreR{animation:mRobF2 .8s steps(4)}.fig.mv-robot svg{animation:mRobB .8s steps(4)}
@keyframes mRobA{25%{transform:rotate(80deg)}50%{transform:rotate(-80deg)}75%{transform:rotate(80deg)}}
@keyframes mRobF{25%{transform:rotate(-90deg)}75%{transform:rotate(90deg)}}@keyframes mRobF2{25%{transform:rotate(90deg)}75%{transform:rotate(-90deg)}}
@keyframes mRobB{25%{transform:translateX(-3%)}50%{transform:translateX(3%)}75%{transform:translateX(-3%)}}
.fig.mv-spin svg{animation:mSpin .8s ease-in-out}
@keyframes mSpin{0%{transform:scaleX(1)}25%{transform:scaleX(-1)}50%{transform:scaleX(1)}75%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.fig.mv-flip svg{animation:mFlip 1s cubic-bezier(.4,0,.3,1);transform-origin:50% 55%}
@keyframes mFlip{0%{transform:translateY(0) rotate(0)}20%{transform:translateY(4%) rotate(0)}60%{transform:translateY(-38%) rotate(-300deg)}85%{transform:translateY(-4%) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
.fig.mv-flip .j-legL,.fig.mv-flip .j-legR{animation:mTuck 1s}
@keyframes mTuck{30%,70%{transform:rotate(-60deg)}}
.fig.mv-jump svg{animation:mJump .7s cubic-bezier(.3,0,.3,1)}.fig.mv-jump .j-legL{animation:mSplitL .7s}.fig.mv-jump .j-legR{animation:mSplitR .7s}.fig.mv-jump .j-armL{animation:mArmL .7s}.fig.mv-jump .j-armR{animation:mArmR .7s}
@keyframes mJump{50%{transform:translateY(-22%)}}@keyframes mSplitL{50%{transform:rotate(60deg)}}@keyframes mSplitR{50%{transform:rotate(-60deg)}}
.fig.mv-shimmy .j-torso{animation:mShim .8s ease-in-out}.fig.mv-shimmy .j-armL{animation:mShimA .8s}.fig.mv-shimmy .j-armR{animation:mShimB .8s}.fig.mv-shimmy svg{animation:mShimS .8s}
@keyframes mShim{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}@keyframes mShimA{20%,60%{transform:rotate(40deg)}40%,80%{transform:rotate(10deg)}}@keyframes mShimB{20%,60%{transform:rotate(-10deg)}40%,80%{transform:rotate(-40deg)}}@keyframes mShimS{25%,75%{transform:scaleY(.95)}}
.fig.mv-slide svg{animation:mSlide 1s ease-in-out}.fig.mv-slide .j-legL{animation:mSlL 1s}.fig.mv-slide .j-legR{animation:mSlR 1s}
@keyframes mSlide{40%{transform:translateX(-14%)}80%{transform:translateX(10%)}}@keyframes mSlL{25%,75%{transform:rotate(25deg)}}@keyframes mSlR{50%{transform:rotate(-25deg)}}
.fig.mv-run .j-legL{animation:runL .3s linear infinite}.fig.mv-run .j-legR{animation:runR .3s linear infinite}.fig.mv-run .j-armL{animation:runR .3s linear infinite}.fig.mv-run .j-armR{animation:runL .3s linear infinite}
@keyframes runL{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}@keyframes runR{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-35deg)}}
.fig.mv-bigkick .j-legR{animation:mKickBig .7s ease-out forwards}.fig.mv-bigkick .j-armL{animation:mArmL .7s}
@keyframes mKickBig{30%,100%{transform:rotate(-100deg)}}
.fig.mv-shove .j-armL,.fig.mv-shove .j-armR{animation:mShove .6s forwards}
@keyframes mShove{40%,100%{transform:rotate(-90deg)}}
.fig.mv-cheer .j-armL{animation:mArmL .5s infinite}.fig.mv-cheer .j-armR{animation:mArmR .5s infinite .25s}

/* ===== Crowd Clash app shell ===== */
html,body{margin:0;min-height:100%}
body{background:var(--stage)}
[hidden]{display:none!important}
.logo{font-family:var(--display);font-size:3.4cqw;line-height:.95;text-align:center;color:var(--fg)}

/* home */
.home{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse 60% 60% at 50% 100%,rgba(34,195,243,.22),transparent 70%),radial-gradient(ellipse 30% 50% at 10% 0%,rgba(255,61,110,.25),transparent 70%),var(--stage)}

.home p{color:var(--muted);margin:0}
.home .big1{display:block;width:100%;padding:20px;border-radius:18px;font-family:var(--display);font-size:22px;text-decoration:none;color:#1b1640;background:var(--gold);box-shadow:0 6px 0 #b8860b}

.home .small{color:var(--muted);font-weight:700}

body.mouse .hostbar[data-mode="game"],body.paused .hostbar{opacity:1}
.hb{border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:99px;padding:10px 16px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}

.netwarn{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#5a0f26;color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;z-index:200}
.tv .whres img{display:block}

body.phonepage{background:var(--stage)}

.acard{background:var(--panel);border-radius:16px;padding:16px 18px;margin-top:16px}
.acard h2{font-family:var(--util);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:21px;margin:0 0 4px}
.acard h2 small{color:var(--muted);font-size:15px}
.muted{color:var(--muted);font-size:14px;margin:4px 0 8px}
.warnt{color:#ffb3c3;font-weight:700;font-size:13px}
.ok{color:var(--lime)}
.qlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.qlist li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--stage-2);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.qlist li.off{opacity:.5}.qlist li.bad{border:1px solid var(--red)}
.qmain{flex:1;min-width:240px;display:grid;gap:4px}
.qt{font-weight:700}
.qa{font-size:13px;color:var(--muted)}.qa b{color:var(--fg)}.qa b.ok{color:var(--lime)}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{justify-self:start;display:inline-block;font-family:var(--util);font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel-2);margin-right:4px}
.fchip.f-falling{background:var(--blue);color:#06233a}.fchip.f-stones{background:var(--violet)}.fchip.f-doors{background:var(--red)}.fchip.f-whack{background:var(--lime);color:#0d2a10}.fchip.f-number{background:var(--gold);color:#1b1640}.fchip.ok{background:#1f5a34}
.tog{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;cursor:pointer}.tog input{width:18px;height:18px;accent-color:var(--lime)}
.tog.big{font-size:15px;padding:8px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-block:8px}
.fgrid label,.full{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fgrid input,.fgrid select,.acard textarea,.lyrrow input,.lyrrow select,.nmi,.pti{background:var(--stage-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 10px;font:600 15px var(--body);min-width:0}
.acard textarea{width:100%;box-sizing:border-box}
.full{width:100%}
.inl{display:flex;gap:6px;align-items:center;color:var(--muted)}.inl input{width:80px}
.optrow .ol{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);flex:none}
.optrow .ao{flex:1;background:var(--stage-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 10px;font:600 15px var(--body);min-width:0}
pre.ex{background:var(--stage-2);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px;color:#cfd3ff}
code{color:#8eeeff;word-break:break-all}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.tbl th{font-family:var(--util);text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:12px}
.nmi{width:140px}.pti{width:80px}
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plc{background:var(--stage-2);border-radius:10px;padding:8px 10px;display:grid;gap:4px}.plc small{color:var(--muted)}.plc.off{opacity:.5}
.fingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.finc{background:var(--stage-2);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.combo{color:var(--gold);letter-spacing:3px}
.pvwrap{margin-top:14px;max-width:760px}.pvwrap .tv{border-radius:14px}
.lyrrows{display:grid;gap:6px}
.lyrrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 120px 120px 40px;gap:6px}
@media (max-width:640px){.lyrrow{grid-template-columns:1fr 70px;}.lyrrow select{grid-column:span 1}}
.pingate{max-width:360px;margin:12vh auto;display:grid;gap:12px;text-align:center}
.pingate h1{font-family:var(--util);text-transform:uppercase;letter-spacing:1px;margin:0}
.pingate input{font:700 28px var(--body);text-align:center;letter-spacing:8px;padding:12px;border-radius:12px;border:2px solid var(--blue);background:var(--panel);color:var(--fg)}
.alink{color:var(--blue)}

.fgrid label.tog{display:inline-flex;flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:15px}

/* ===== AT&T Dallas theme ===== */
.dalsky{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:0;opacity:.5}
.dalsky svg{width:100%;height:100%;display:block}
.dalsky.stad{bottom:54%;height:22%;opacity:.85}
.dalsky.fight{opacity:.35;filter:hue-rotate(160deg) saturate(1.6)}
.venue{position:absolute;top:.3cqw;left:50%;transform:translateX(-50%);z-index:20;font-family:var(--util);font-weight:800;letter-spacing:.25cqw;text-transform:uppercase;font-size:1.05cqw;color:var(--gold);background:rgba(6,26,54,.75);border:.15cqw solid rgba(255,184,28,.5);padding:.2cqw 1.2cqw;border-radius:99px;white-space:nowrap}
.sub{font-family:var(--util);font-weight:800;letter-spacing:.35cqw;color:var(--blue);font-size:1.5cqw;text-transform:uppercase}
.home .kick{font-family:var(--util);font-weight:800;letter-spacing:4px;color:var(--blue);text-transform:uppercase;font-size:18px}
.tv>.tvin,.tv>.stagebg,.tv>.slots{position:relative}
.tv .tvin{z-index:2}

.bfil{display:flex;gap:6px;margin:0 0 8px}.bfil button{flex:1;padding:8px 4px;border-radius:999px;border:2px solid var(--panel-2);background:var(--panel);color:var(--fg);font:inherit;font-weight:800;font-size:12px;cursor:pointer}.bfil button.on{border-color:var(--gold);background:var(--panel-2);color:var(--gold)}

/* ===== v1.2: pacing, instructions, lineup, doors, finisher roulette, dodge ===== */
/* celebration: a happy bounce with both arms up together and small fist pumps (no arm windmill) */
.fig.mv-cheer svg{animation:cheerHop .9s ease-in-out infinite;transform-origin:50% 100%}
.fig.mv-cheer .j-armL{animation:cheerArmL .9s ease-in-out infinite}.fig.mv-cheer .j-armR{animation:cheerArmR .9s ease-in-out infinite}
.fig.mv-cheer .j-foreL{animation:cheerFore .45s ease-in-out infinite alternate}.fig.mv-cheer .j-foreR{animation:cheerForeR .45s ease-in-out infinite alternate}
@keyframes cheerHop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(1%) scaleY(.96)}45%{transform:translateY(-9%) scaleY(1.02)}70%{transform:translateY(0) scaleY(1)}}
@keyframes cheerArmL{0%,100%{transform:rotate(128deg)}45%{transform:rotate(140deg)}}@keyframes cheerArmR{0%,100%{transform:rotate(-128deg)}45%{transform:rotate(-140deg)}}
@keyframes cheerFore{from{transform:rotate(0)}to{transform:rotate(-28deg)}}@keyframes cheerForeR{from{transform:rotate(0)}to{transform:rotate(28deg)}}
/* sky uppercut: crouch, wind up, spring up with one arm straight up */
.fig.mv-upper svg{animation:upBody 1.1s cubic-bezier(.3,0,.3,1);transform-origin:50% 100%}
.fig.mv-upper .j-armR{animation:upArm 1.1s cubic-bezier(.3,0,.3,1)}.fig.mv-upper .j-foreR{animation:upFore 1.1s}
.fig.mv-upper .j-legL{animation:upLegL 1.1s}.fig.mv-upper .j-legR{animation:upLegR 1.1s}
@keyframes upBody{0%{transform:none}30%{transform:translateY(7%) scaleY(.86)}50%{transform:translateY(-24%) scaleY(1.06) rotate(-4deg)}75%{transform:translateY(-24%) rotate(-4deg)}100%{transform:none}}
@keyframes upArm{0%{transform:none}30%{transform:rotate(45deg)}48%,80%{transform:rotate(-172deg)}100%{transform:none}}
@keyframes upFore{0%{transform:none}30%{transform:rotate(-70deg)}48%,80%{transform:rotate(0)}100%{transform:none}}
@keyframes upLegL{30%{transform:rotate(22deg)}50%{transform:rotate(-12deg)}}@keyframes upLegR{30%{transform:rotate(-22deg)}50%{transform:rotate(30deg)}}
.fig.mv-toss .j-armR{animation:tossA .7s ease-out}@keyframes tossA{0%{transform:rotate(30deg)}50%{transform:rotate(-120deg)}100%{transform:rotate(0)}}
.fig.mv-point .j-armR{animation:pointA 1.4s ease-in-out}@keyframes pointA{20%,80%{transform:rotate(-160deg)}}
.fig.mv-slip .j-legL{animation:slipL 1.2s forwards}.fig.mv-slip .j-legR{animation:slipR 1.2s forwards}.fig.mv-slip .j-armL{animation:mArmL 1s}.fig.mv-slip .j-armR{animation:mArmR 1s}
@keyframes slipL{30%,100%{transform:rotate(-70deg)}}@keyframes slipR{30%,100%{transform:rotate(-95deg)}}
.burst{position:absolute;left:52%;top:30%;width:14cqw;height:14cqw;margin:-7cqw;z-index:22;background:radial-gradient(circle,#fff 0 18%,#ffcf3f 19% 34%,#ff7a1a 35% 46%,transparent 47%);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:burstA .6s ease-out forwards}
@keyframes burstA{from{transform:scale(.2) rotate(0)}to{transform:scale(1.3) rotate(40deg);opacity:0}}
.startrail{position:absolute;left:55%;top:0;width:.8cqw;height:60%;z-index:3;background:linear-gradient(180deg,transparent,#ffcf3f,#fff);border-radius:1cqw;opacity:.8;animation:fl 1.5s forwards}
.speedl{position:absolute;left:40%;right:0;bottom:12%;height:8%;z-index:3;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0 .25cqw,transparent .25cqw 1.6cqw);animation:fl 1s forwards}
.nana{bottom:auto;width:5cqw}
.boot{bottom:auto;width:24%;z-index:20;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.35))}
.boot .rowel{animation:rowel .4s linear infinite}@keyframes rowel{to{transform:rotate(360deg)}}

/* how to play card */
.tvin.how{justify-content:center;align-items:center;gap:1.6cqw}
.howtop{position:absolute;top:2.4cqw;left:3cqw;right:3cqw;display:flex;gap:1cqw;font-family:var(--util);font-weight:800;font-size:1.8cqw}
.howcard{display:flex;gap:2.4cqw;align-items:center;background:rgba(14,47,90,.92);border:.25cqw solid var(--blue);border-radius:2cqw;padding:2cqw 3cqw;max-width:82%}
.howic{font-size:7cqw;line-height:1}.hown{font-family:var(--display);font-size:3.6cqw;color:var(--gold);line-height:1;margin-bottom:.8cqw}
.hows{margin:0;padding-left:2.6cqw;display:grid;gap:.6cqw;font-size:2.2cqw;font-weight:700}
.hows li{opacity:0;animation:howIn .5s ease-out forwards}.hows li::marker{color:var(--gold);font-family:var(--display)}
@keyframes howIn{from{opacity:0;transform:translateX(-2cqw)}to{opacity:1;transform:none}}
.howq{max-width:80%;text-align:center;font-family:var(--display);font-size:2.4cqw;line-height:1.15}.howq span{display:block;font-family:var(--util);font-weight:800;font-size:1.4cqw;letter-spacing:.2cqw;color:var(--muted)}
.howwhy{font-size:1.6cqw;color:var(--muted);font-weight:600}
.howgo{font-family:var(--util);font-weight:800;font-size:2cqw;letter-spacing:.15cqw;text-transform:uppercase}.howgo b{font-family:var(--display);font-size:3cqw;color:var(--gold)}
.ansbar{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:40;display:flex;gap:1.4cqw;align-items:center;background:rgba(6,26,54,.94);border:.25cqw solid var(--gold);border-radius:1.4cqw;padding:.8cqw 2cqw;font-family:var(--util);font-weight:800;font-size:1.6cqw;letter-spacing:.1cqw;animation:drop .5s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
.ansbar b{font-family:var(--display);font-weight:400;font-size:2.6cqw;color:var(--gold)}.ansbar span{color:var(--muted)}
.decoy{position:absolute;left:1.4cqw;bottom:.6cqw;z-index:30;font-size:1cqw;color:rgba(255,255,255,.38);font-style:italic;pointer-events:none}
.floaty{display:grid;justify-items:center;font-size:1.6cqw}.floaty i{font-style:normal;font-size:3.6cqw;line-height:1}.floaty small{font-family:var(--util);font-size:1cqw;color:#fff;opacity:.8}

/* door dash v2 */
.door3{position:absolute;top:27%;width:18.5%;height:45%;z-index:3;display:flex;flex-direction:column;align-items:center}
.sign3{background:#0b1a3a;border:.3cqw solid;border-radius:1cqw;padding:.5cqw 1cqw;min-height:4.4cqw;width:96%;display:grid;place-items:center;box-shadow:0 0 1.4cqw rgba(0,159,219,.3);margin-bottom:.6cqw}
.sign3 span{font-weight:800;font-size:1.55cqw;text-align:center;line-height:1.1}
.frame3{position:relative;flex:1;width:78%;background:linear-gradient(180deg,#5b6a8f,#3a4566);border:.35cqw solid #1a1430;border-radius:7cqw 7cqw .4cqw .4cqw;padding:.9cqw .9cqw 0;box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.08)}
.arch3{position:absolute;top:-1.6cqw;left:50%;transform:translateX(-50%);width:4cqw;height:4cqw;border-radius:50%;background:var(--dc);border:.3cqw solid #1a1430;display:grid;place-items:center;z-index:3}.arch3 b{font-family:var(--display);font-size:2cqw;color:#1a1430}
.in3{position:absolute;inset:.9cqw .9cqw 0;border-radius:6cqw 6cqw 0 0;background:#05061a;overflow:hidden}
.lite3{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,#fff6c4,#ffcf3f 35%,rgba(255,180,0,.2) 70%,transparent);opacity:0;transition:opacity .7s}
.leaf3{position:absolute;inset:.9cqw .9cqw 0;border-radius:6cqw 6cqw 0 0;background:linear-gradient(90deg,#7a4a2a,#a0663a 50%,#7a4a2a);border:.25cqw solid #1a1430;transform-origin:left;transition:transform 1s cubic-bezier(.5,0,.2,1);z-index:2}
.leaf3 i{position:absolute;left:14%;right:14%;border:.25cqw solid rgba(26,20,48,.55);border-radius:.5cqw;background:rgba(255,255,255,.05)}
.leaf3 .p1{top:14%;height:22%;border-radius:4cqw 4cqw .5cqw .5cqw}.leaf3 .p2{top:42%;height:22%}.leaf3 .p3{top:70%;height:22%}.leaf3 .p4{display:none}
.leaf3 .knob3{left:auto;right:9%;top:52%;width:1.4cqw;height:1.4cqw;border-radius:50%;background:var(--gold);border:.2cqw solid #1a1430}
.door3.open .leaf3{transform:perspective(40cqw) rotateY(-82deg)}.door3.open .lite3{opacity:1}.door3.open .frame3{box-shadow:0 0 4cqw rgba(255,207,63,.7)}
.door3.shut .frame3{filter:brightness(.55) saturate(.6)}.door3.shut .sign3{opacity:.5}
.cnt3{font-family:var(--display);font-size:1.6cqw;color:var(--gold);min-height:2cqw}

/* imposter lineup */
.lineup{position:absolute;inset:0;background:linear-gradient(180deg,#12244a,#0a1530)}
.hch{position:absolute;left:4%;right:4%;top:32%;bottom:16%}.hch i{position:absolute;left:0;right:0;border-top:.2cqw solid rgba(255,255,255,.22)}.hch b{position:absolute;left:0;top:-1.6cqw;font-family:var(--util);font-size:1.1cqw;color:rgba(255,255,255,.4)}
.spot{position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,255,255,.08),transparent)}
.suspects{position:absolute;left:6%;right:6%;top:33%;bottom:15%;display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;z-index:4}
.suspect{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .6s,transform .6s}
.suspect svg{width:62%;height:auto}
.placard{margin-top:-4.8cqw;background:#f4f1ea;color:#1b1640;border:.3cqw solid #1a1430;border-radius:.6cqw;padding:.5cqw .8cqw;width:94%;text-align:center;font-weight:800;font-size:1.45cqw;line-height:1.1;display:grid;gap:.2cqw;z-index:2}
.placard b{font-family:var(--display);font-weight:400;font-size:1.6cqw;color:var(--violet)}.placard em{font-style:normal;font-family:var(--util);font-size:1.2cqw;color:#5a6190}
.stamp{position:absolute;top:28%;left:50%;transform:translateX(-50%) rotate(-12deg) scale(2.4);opacity:0;font-family:var(--display);font-size:2.4cqw;padding:.2cqw 1cqw;border:.35cqw solid;border-radius:.6cqw;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s;z-index:3;background:rgba(10,13,38,.6)}
.suspect.cleared{opacity:.55;transform:translateY(1cqw)}.suspect.cleared .stamp{opacity:1;transform:translateX(-50%) rotate(-12deg) scale(1);color:var(--lime);border-color:var(--lime);font-size:1.8cqw}
.suspect.caught{transform:scale(1.08)}.suspect.caught .stamp{opacity:1;transform:translateX(-50%) rotate(-12deg) scale(1);color:var(--red);border-color:var(--red)}
.suspect.caught svg{filter:drop-shadow(0 0 2cqw var(--red))}.suspect.caught .placard{background:#ffd6de}

/* finisher roulette */
.roul{display:grid;grid-template-columns:1fr 2.2fr;gap:2cqw;flex:1;align-items:stretch;margin-top:.6cqw}
.rbox{background:rgba(10,13,38,.86);border:.2cqw solid var(--line);border-radius:1.4cqw;padding:1.2cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.rlab{font-family:var(--util);font-weight:800;font-size:1.7cqw;letter-spacing:.2cqw;color:var(--gold)}
.rface{width:10cqw;height:10cqw;display:grid;place-items:center;border-radius:50%;transition:transform .3s}.rface.land{transform:scale(1.15);filter:drop-shadow(0 0 2cqw var(--gold))}
.rname{font-family:var(--display);font-size:2.4cqw}.rsub{font-size:1.25cqw;color:var(--muted);text-align:center}
.fgrid2{display:grid;grid-template-columns:repeat(4,1fr);gap:.8cqw;width:100%}
.fcard{position:relative;background:var(--panel);border:.25cqw solid var(--panel-2);border-radius:1cqw;padding:.7cqw;display:grid;justify-items:center;gap:.1cqw;text-align:center;transition:transform .12s,border-color .12s}
.fcard i{font-style:normal;font-size:2.6cqw;line-height:1.1}.fcard b{font-family:var(--display);font-weight:400;font-size:1.2cqw;line-height:1.05}.fcard span{font-family:var(--display);font-size:1.4cqw;color:var(--gold)}.fcard small{font-size:1cqw;color:var(--muted)}
.fcard.used{opacity:.32}.fcard em{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-style:normal;font-family:var(--display);font-size:1.6cqw;color:var(--red);border:.2cqw solid var(--red);padding:0 .5cqw;border-radius:.4cqw}
.fcard.hi{border-color:#fff;transform:scale(1.06)}.fcard.pick{border-color:var(--gold);background:var(--panel-2);transform:scale(1.12);box-shadow:0 0 2.4cqw rgba(255,184,28,.7);z-index:2}
.dangrow{display:flex;gap:1cqw;align-items:center;background:rgba(90,15,38,.7);border-radius:1cqw;padding:.6cqw 1.2cqw;font-family:var(--util);font-weight:800;font-size:1.5cqw;flex-wrap:wrap}
.dangrow>span{color:var(--red);letter-spacing:.2cqw}.dangrow>div{display:flex;align-items:center;gap:.4cqw}.dangrow em{font-style:normal;font-weight:600;font-size:1.25cqw;color:#ffd6de;margin-left:auto}
.kostat{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1cqw;z-index:25}
.kostat>div{background:rgba(10,13,38,.9);border-radius:.8cqw;padding:.7cqw 1.2cqw;display:grid;gap:.1cqw;border-left:.5cqw solid var(--red)}
.kostat span{font-family:var(--util);font-weight:800;font-size:1.2cqw;letter-spacing:.15cqw;color:var(--muted)}.kostat b{font-family:var(--display);font-weight:400;font-size:1.7cqw;color:var(--gold)}.kostat em{font-style:normal;font-size:1.25cqw}

/* final face-off status plates */
.fstat{margin:.5cqw auto 0;min-width:80%;text-align:center;font-family:var(--util);font-weight:800;font-size:1.4cqw;letter-spacing:.1cqw;background:#23295f;border-radius:.6cqw;padding:.4cqw .8cqw;display:grid;line-height:1.15}
.fstat small{font-size:1.1cqw;color:var(--muted)}.fstat b{font-family:var(--display);font-weight:400}
.fstat.lock{background:var(--blue);color:#06233a}.fstat.lock small{color:#06233a}
.fstat.win{background:var(--gold);color:#1b1640;box-shadow:0 0 2cqw var(--gold)}.fstat.win small{color:#1b1640}.fstat.ok{background:#2f6b3a}.fstat.bad{background:#6b1f33}

/* phone */
.react2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.react2 button{border:0;border-radius:12px;background:var(--panel-2);color:#fff;font-family:var(--util);font-weight:800;font-size:11px;letter-spacing:.5px;padding:6px 2px;display:grid;justify-items:center;gap:1px;transition:transform .1s}

/* ===================================================================
   v1.5 human rig moves. Every body shares one relaxed standing pose, so every
   move below looks the same on every fighter. Angles: left arm/leg (screen left)
   rotate positive to lift outward, right arm/leg negative. Elbows only ever bend
   toward the head or the body, knees only bend the natural way.
   =================================================================== */
.fig svg{overflow:visible}
/* celebration: hop with both arms up in a V and small fist pumps */
.fig.mv-cheer svg{animation:hCheerHop .8s ease-in-out infinite;transform-origin:50% 100%}
.fig.mv-cheer .j-armL{animation:hCheerAL .8s ease-in-out infinite}.fig.mv-cheer .j-armR{animation:hCheerAR .8s ease-in-out infinite}
.fig.mv-cheer .j-foreL{animation:hCheerFL .8s ease-in-out infinite}.fig.mv-cheer .j-foreR{animation:hCheerFR .8s ease-in-out infinite}
.fig.mv-cheer .j-legL{animation:hCheerLL .8s ease-in-out infinite}.fig.mv-cheer .j-legR{animation:hCheerLR .8s ease-in-out infinite}
@keyframes hCheerHop{0%,100%{transform:translateY(0)}15%{transform:translateY(2%) scaleY(.97)}45%{transform:translateY(-8%)}75%{transform:translateY(0)}}
@keyframes hCheerAL{0%,100%{transform:rotate(118deg)}45%{transform:rotate(132deg)}}@keyframes hCheerAR{0%,100%{transform:rotate(-118deg)}45%{transform:rotate(-132deg)}}
@keyframes hCheerFL{0%,100%{transform:rotate(40deg)}45%{transform:rotate(12deg)}}@keyframes hCheerFR{0%,100%{transform:rotate(-40deg)}45%{transform:rotate(-12deg)}}
@keyframes hCheerLL{45%{transform:rotate(8deg)}}@keyframes hCheerLR{45%{transform:rotate(-8deg)}}
/* running: legs and arms swing in opposition, forearms bent like a runner */
.fig.mv-run svg{animation:hRunBob .32s ease-in-out infinite}
.fig.mv-run .j-legL{animation:hRunL .32s linear infinite}.fig.mv-run .j-legR{animation:hRunR .32s linear infinite}
.fig.mv-run .j-armL{animation:hRunR .32s linear infinite}.fig.mv-run .j-armR{animation:hRunL .32s linear infinite}
.fig.mv-run .j-foreL{transform:rotate(-70deg)}.fig.mv-run .j-foreR{transform:rotate(70deg)}
@keyframes hRunBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes hRunL{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}@keyframes hRunR{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}

/* ---- the nine Dance-Off moves (identical for every body) ---- */
.fig.mv-armsup svg{animation:hBounce .9s ease-in-out;transform-origin:50% 100%}
.fig.mv-armsup .j-armL{animation:hUpAL .9s ease-in-out}.fig.mv-armsup .j-armR{animation:hUpAR .9s ease-in-out}
.fig.mv-armsup .j-foreL{animation:hUpFL .9s ease-in-out}.fig.mv-armsup .j-foreR{animation:hUpFR .9s ease-in-out}
@keyframes hBounce{0%,100%{transform:none}25%{transform:translateY(3%) scaleY(.96)}55%{transform:translateY(-5%)}}
@keyframes hUpAL{35%,75%{transform:rotate(132deg)}}@keyframes hUpAR{35%,75%{transform:rotate(-132deg)}}
@keyframes hUpFL{20%{transform:rotate(60deg)}35%,75%{transform:rotate(18deg)}}@keyframes hUpFR{20%{transform:rotate(-60deg)}35%,75%{transform:rotate(-18deg)}}

.fig.mv-wave svg{animation:hSway .9s ease-in-out;transform-origin:50% 100%}
.fig.mv-wave .j-armR{animation:hWaveA .9s ease-in-out}.fig.mv-wave .j-foreR{animation:hWaveF .9s ease-in-out}.fig.mv-wave .j-armL{animation:hWaveL .9s ease-in-out}
@keyframes hSway{30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
@keyframes hWaveA{20%,85%{transform:rotate(-120deg)}}@keyframes hWaveF{20%{transform:rotate(-20deg)}35%{transform:rotate(-55deg)}50%{transform:rotate(-15deg)}65%{transform:rotate(-55deg)}80%{transform:rotate(-20deg)}}
@keyframes hWaveL{20%,85%{transform:rotate(25deg)}}

.fig.mv-kick svg{animation:hKickB .9s ease-in-out;transform-origin:50% 100%}
.fig.mv-kick .j-legR{animation:hKickL .9s ease-out}.fig.mv-kick .j-shinR{animation:hKickS .9s ease-out}
.fig.mv-kick .j-armL{animation:hKickAL .9s ease-out}.fig.mv-kick .j-armR{animation:hKickAR .9s ease-out}
@keyframes hKickB{30%,60%{transform:rotate(-7deg)}}
@keyframes hKickL{20%{transform:rotate(-20deg)}40%,60%{transform:rotate(-70deg)}}@keyframes hKickS{20%{transform:rotate(35deg)}40%,60%{transform:rotate(0)}}
@keyframes hKickAL{30%,65%{transform:rotate(75deg)}}@keyframes hKickAR{30%,65%{transform:rotate(-40deg)}}

.fig.mv-disco svg{animation:hDiscoB .9s ease-in-out;transform-origin:50% 100%}
.fig.mv-disco .j-armR{animation:hDiscoR .9s ease-in-out}.fig.mv-disco .j-foreR{animation:hDiscoRF .9s ease-in-out}
.fig.mv-disco .j-armL{animation:hDiscoL .9s ease-in-out}.fig.mv-disco .j-foreL{animation:hDiscoLF .9s ease-in-out}
@keyframes hDiscoB{20%,45%{transform:translateX(2%) rotate(4deg)}65%,90%{transform:translateX(-2%) rotate(-4deg)}}
@keyframes hDiscoR{20%,45%{transform:rotate(-140deg)}65%,90%{transform:rotate(25deg)}}@keyframes hDiscoRF{20%,45%{transform:rotate(0)}65%,90%{transform:rotate(15deg)}}
@keyframes hDiscoL{10%,90%{transform:rotate(40deg)}}@keyframes hDiscoLF{10%,90%{transform:rotate(-100deg)}}

.fig.mv-robot svg{animation:hRobB .9s steps(1)}
.fig.mv-robot .j-armL{animation:hRobAL .9s steps(1)}.fig.mv-robot .j-armR{animation:hRobAR .9s steps(1)}
.fig.mv-robot .j-foreL{animation:hRobFL .9s steps(1)}.fig.mv-robot .j-foreR{animation:hRobFR .9s steps(1)}
@keyframes hRobB{0%{transform:none}20%{transform:translateX(-2%)}45%{transform:translateX(2%)}70%{transform:translateX(-2%)}95%{transform:none}}
@keyframes hRobAL{0%{transform:none}20%,95%{transform:rotate(85deg)}100%{transform:none}}@keyframes hRobAR{0%{transform:none}20%,95%{transform:rotate(-85deg)}100%{transform:none}}
@keyframes hRobFL{0%{transform:none}20%{transform:rotate(90deg)}45%{transform:rotate(-90deg)}70%{transform:rotate(90deg)}95%,100%{transform:none}}
@keyframes hRobFR{0%{transform:none}20%{transform:rotate(90deg)}45%{transform:rotate(-90deg)}70%{transform:rotate(90deg)}95%,100%{transform:none}}

.fig.mv-shimmy svg{animation:hShimB .9s ease-in-out;transform-origin:50% 100%}.fig.mv-shimmy .j-torso{animation:hShimT .9s ease-in-out}
.fig.mv-shimmy .j-armL{animation:hShimAL .9s ease-in-out}.fig.mv-shimmy .j-armR{animation:hShimAR .9s ease-in-out}
.fig.mv-shimmy .j-foreL{animation:hShimFL .9s ease-in-out}.fig.mv-shimmy .j-foreR{animation:hShimFR .9s ease-in-out}
@keyframes hShimB{25%,75%{transform:translateY(2%) scaleY(.97)}50%{transform:none}}
@keyframes hShimT{20%,60%{transform:rotate(-5deg)}40%,80%{transform:rotate(5deg)}}
@keyframes hShimAL{10%,90%{transform:rotate(40deg)}20%,60%{transform:rotate(55deg)}}@keyframes hShimAR{10%,90%{transform:rotate(-40deg)}40%,80%{transform:rotate(-55deg)}}
@keyframes hShimFL{10%,90%{transform:rotate(100deg)}}@keyframes hShimFR{10%,90%{transform:rotate(-100deg)}}

.fig.mv-jump svg{animation:hJumpB .9s cubic-bezier(.3,0,.3,1);transform-origin:50% 100%}
.fig.mv-jump .j-armL{animation:hJumpAL .9s}.fig.mv-jump .j-armR{animation:hJumpAR .9s}
.fig.mv-jump .j-legL{animation:hJumpLL .9s}.fig.mv-jump .j-legR{animation:hJumpLR .9s}
@keyframes hJumpB{15%{transform:translateY(3%) scaleY(.94)}45%{transform:translateY(-20%)}75%{transform:translateY(0)}85%{transform:translateY(2%) scaleY(.97)}}
@keyframes hJumpAL{30%,65%{transform:rotate(125deg)}}@keyframes hJumpAR{30%,65%{transform:rotate(-125deg)}}
@keyframes hJumpLL{30%,65%{transform:rotate(28deg)}}@keyframes hJumpLR{30%,65%{transform:rotate(-28deg)}}

.fig.mv-slide svg{animation:hSlideB 1s ease-in-out}
.fig.mv-slide .j-legL{animation:hSlideLL 1s ease-in-out}.fig.mv-slide .j-legR{animation:hSlideLR 1s ease-in-out}
.fig.mv-slide .j-armL{animation:hSlideAL 1s ease-in-out}.fig.mv-slide .j-armR{animation:hSlideAR 1s ease-in-out}
@keyframes hSlideB{40%{transform:translateX(-12%)}80%{transform:translateX(8%)}}
@keyframes hSlideLL{20%,40%{transform:rotate(20deg)}}@keyframes hSlideLR{60%,80%{transform:rotate(-20deg)}}
@keyframes hSlideAL{20%,40%{transform:rotate(50deg)}60%,80%{transform:rotate(15deg)}}@keyframes hSlideAR{20%,40%{transform:rotate(-15deg)}60%,80%{transform:rotate(-50deg)}}

.fig.mv-flip svg{animation:hFlipB 1s cubic-bezier(.4,0,.3,1);transform-origin:50% 55%}
.fig.mv-flip .j-armL{animation:hUpAL 1s}.fig.mv-flip .j-armR{animation:hUpAR 1s}
.fig.mv-flip .j-legL{animation:hTuckL 1s}.fig.mv-flip .j-legR{animation:hTuckR 1s}.fig.mv-flip .j-shinL{animation:hTuckSL 1s}.fig.mv-flip .j-shinR{animation:hTuckSR 1s}
@keyframes hFlipB{0%{transform:none}20%{transform:translateY(4%)}60%{transform:translateY(-30%) rotate(-300deg)}85%{transform:translateY(-3%) rotate(-360deg)}100%{transform:rotate(-360deg)}}
@keyframes hTuckL{30%,70%{transform:rotate(30deg)}}@keyframes hTuckR{30%,70%{transform:rotate(-30deg)}}@keyframes hTuckSL{30%,70%{transform:rotate(-55deg)}}@keyframes hTuckSR{30%,70%{transform:rotate(55deg)}}

/* ---- knockout: three simple attacks and three defences ---- */
/* HIGH KICK: right leg swings up to head height */
.fig.mv-hkick svg{animation:hHkB 1.1s ease-in-out;transform-origin:50% 100%}
.fig.mv-hkick .j-legR{animation:hHkL 1.1s ease-out}.fig.mv-hkick .j-shinR{animation:hHkS 1.1s ease-out}
.fig.mv-hkick .j-armL{animation:hHkAL 1.1s}.fig.mv-hkick .j-armR{animation:hHkAR 1.1s}.fig.mv-hkick .j-foreL{animation:hGuardFL 1.1s}
@keyframes hHkB{35%,70%{transform:rotate(-14deg)}}
@keyframes hHkL{25%{transform:rotate(-40deg)}45%,70%{transform:rotate(-112deg)}}@keyframes hHkS{25%{transform:rotate(50deg)}45%,70%{transform:rotate(0)}}
@keyframes hHkAL{35%,70%{transform:rotate(70deg)}}@keyframes hHkAR{35%,70%{transform:rotate(-30deg)}}@keyframes hGuardFL{35%,70%{transform:rotate(90deg)}}
/* BODY PUNCH: right arm drives straight out at chest height */
.fig.mv-punch svg{animation:hPuB 1.1s ease-in-out;transform-origin:50% 100%}
.fig.mv-punch .j-armR{animation:hPuA 1.1s cubic-bezier(.3,0,.2,1)}.fig.mv-punch .j-foreR{animation:hPuF 1.1s cubic-bezier(.3,0,.2,1)}
.fig.mv-punch .j-armL{animation:hPuAL 1.1s}.fig.mv-punch .j-foreL{animation:hPuFL 1.1s}.fig.mv-punch .j-legL{animation:hPuLL 1.1s}.fig.mv-punch .j-legR{animation:hPuLR 1.1s}
@keyframes hPuB{25%{transform:translateX(-3%)}45%,70%{transform:translateX(6%) rotate(4deg)}}
@keyframes hPuA{25%{transform:rotate(-40deg)}45%,70%{transform:rotate(-92deg)}}@keyframes hPuF{25%{transform:rotate(-90deg)}45%,70%{transform:rotate(0)}}
@keyframes hPuAL{25%,70%{transform:rotate(40deg)}}@keyframes hPuFL{25%,70%{transform:rotate(120deg)}}
@keyframes hPuLL{45%,70%{transform:rotate(14deg)}}@keyframes hPuLR{45%,70%{transform:rotate(-14deg)}}
/* LEG SWEEP: drops low and sweeps the right leg along the floor */
.fig.mv-sweep2 svg{animation:hSwB 1.1s ease-in-out;transform-origin:50% 100%}
.fig.mv-sweep2 .j-legR{animation:hSwL 1.1s ease-in-out}.fig.mv-sweep2 .j-legL{animation:hSwLL 1.1s}.fig.mv-sweep2 .j-shinL{animation:hSwSL 1.1s}
.fig.mv-sweep2 .j-armL{animation:hSwAL 1.1s}.fig.mv-sweep2 .j-armR{animation:hSwAR 1.1s}
@keyframes hSwB{25%,75%{transform:translateY(16%)}}
@keyframes hSwL{25%{transform:rotate(-30deg)}50%,75%{transform:rotate(-80deg)}}@keyframes hSwLL{25%,75%{transform:rotate(35deg)}}@keyframes hSwSL{25%,75%{transform:rotate(-60deg)}}
@keyframes hSwAL{25%,75%{transform:rotate(60deg)}}@keyframes hSwAR{25%,75%{transform:rotate(-30deg)}}
/* defences, held while the class is on */
.fig.df-duck svg{transform:translateY(26%) scaleY(.78);transform-origin:50% 100%;transition:transform .25s}
.fig.df-duck .j-legL{transform:rotate(38deg)}.fig.df-duck .j-shinL{transform:rotate(-70deg)}.fig.df-duck .j-legR{transform:rotate(-38deg)}.fig.df-duck .j-shinR{transform:rotate(70deg)}
.fig.df-duck .j-armL{transform:rotate(115deg)}.fig.df-duck .j-foreL{transform:rotate(95deg)}.fig.df-duck .j-armR{transform:rotate(-115deg)}.fig.df-duck .j-foreR{transform:rotate(-95deg)}
.fig.df-block .j-armL{transform:rotate(60deg)}.fig.df-block .j-foreL{transform:rotate(140deg)}.fig.df-block .j-armR{transform:rotate(-60deg)}.fig.df-block .j-foreR{transform:rotate(-140deg)}
.fig.df-block svg{transform:translateX(2%);transition:transform .2s}
.fig.df-jump svg{transform:translateY(-22%);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.fig.df-jump .j-legL{transform:rotate(30deg)}.fig.df-jump .j-shinL{transform:rotate(-60deg)}.fig.df-jump .j-legR{transform:rotate(-30deg)}.fig.df-jump .j-shinR{transform:rotate(60deg)}
.fig.df-jump .j-armL{transform:rotate(125deg)}.fig.df-jump .j-armR{transform:rotate(-125deg)}
.fig .j-armL,.fig .j-armR,.fig .j-foreL,.fig .j-foreR,.fig .j-legL,.fig .j-legR,.fig .j-shinL,.fig .j-shinR{transition:transform .2s}

/* ===== v1.5 screens ===== */
/* team crests replace the red and blue arches */
.tcrest{width:100%;height:auto;display:block;filter:drop-shadow(0 0 1.2cqw rgba(0,0,0,.6))}
.tcrest.sm{width:3.4cqw;height:3.4cqw;display:inline-block;vertical-align:middle}
.crest{position:absolute;top:24%;width:12cqw;z-index:4;display:grid;justify-items:center;gap:.5cqw;animation:crestIn .8s cubic-bezier(.2,1.5,.4,1) both}
.crest span{font-family:var(--display);font-size:1.5cqw;text-align:center;line-height:1;-webkit-text-stroke:.08cqw var(--ink)}
.crest.l{left:1.5%;color:var(--red)}.crest.r{right:1.5%;color:var(--blue)}
.crest.l .tcrest{filter:drop-shadow(0 0 2cqw rgba(255,61,110,.7))}.crest.r .tcrest{filter:drop-shadow(0 0 2cqw rgba(0,159,219,.7))}
@keyframes crestIn{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.ph .tcrest{width:90px;margin:0 auto}
/* pause */
.pauseov{position:fixed;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:8px;background:rgba(7,10,34,.72);backdrop-filter:blur(3px);pointer-events:none}
.pauseov b{font-family:var(--display);font-size:clamp(34px,7vw,90px);color:var(--gold);-webkit-text-stroke:2px var(--ink)}.pauseov span{font-weight:700;color:var(--fg);font-size:clamp(14px,1.8vw,22px)}
.hostbar[data-mode="game"]{opacity:.55;left:auto;right:12px;bottom:12px;transform:none;padding:6px;gap:6px}
.hostbar[data-mode="game"] .hb{padding:8px 13px;font-size:14px}
.hostbar[data-mode="game"]:hover,body.mouse .hostbar[data-mode="game"],body.paused .hostbar{opacity:1}
/* wheel of fate: bigger and easier to read */
.fate{width:37cqw;height:37cqw;margin:.6cqw auto 0}
.flab span{left:15%;top:0;transform:translateY(-50%);width:15cqw;white-space:normal;text-align:center;font-size:1.75cqw;line-height:1.05}
.fhub{width:5cqw;height:5cqw;font-size:2.2cqw}
.fres{font-size:3.4cqw;margin-top:.6cqw}
.fused{display:flex;flex-wrap:wrap;gap:.5cqw;justify-content:center;font-family:var(--util);font-weight:800;font-size:1.2cqw;margin-top:.4cqw}
.fused span{background:rgba(10,13,38,.8);border:.12cqw solid var(--line);border-radius:99px;padding:.15cqw .8cqw}.fused span.u{opacity:.35;text-decoration:line-through}
/* arena exit: why they are leaving */
.whyout{position:absolute;right:3%;top:16%;z-index:8;background:rgba(10,13,38,.94);border:.3cqw solid var(--red);border-radius:1.4cqw;padding:1cqw 1.6cqw;display:grid;gap:.3cqw;justify-items:center;min-width:22cqw;animation:rv3 .5s;transition:transform .5s,opacity .5s;transform-origin:100% 0}
.whyout span{font-family:var(--util);font-weight:800;letter-spacing:.2cqw;color:var(--red);font-size:1.6cqw}.whyout b{font-family:var(--display);font-weight:400;font-size:3cqw;color:#fff}.whyout em{font-style:normal;font-family:var(--display);font-size:2.2cqw;color:var(--gold)}
.whyout .wlist{display:grid;gap:.2cqw;width:100%;margin-top:.4cqw;font-family:var(--util);font-weight:700;font-size:1.4cqw;color:var(--muted)}
.whyout .wlist i{font-style:normal;display:flex;justify-content:space-between;gap:1cqw;padding:.1cqw .6cqw;border-radius:.6cqw}.whyout .wlist i.me{background:rgba(255,61,110,.3);color:#fff}
.whyout.small{transform:scale(.7)}
/* knockout */
.kolegend{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;margin-top:auto}
.kolegend .kl{background:rgba(10,13,38,.9);border:.2cqw solid var(--line);border-radius:1.2cqw;padding:.7cqw 1cqw;display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:.6cqw;font-family:var(--util);font-weight:800;font-size:1.6cqw;transition:all .4s}
.kolegend .kl .z{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:1.3cqw;color:var(--muted);letter-spacing:.2cqw;text-align:center}
.kolegend .kl b{grid-column:1/3;color:#ffd6de}.kolegend .kl i{font-style:normal;color:var(--gold)}.kolegend .kl em{font-style:normal;color:var(--lime)}
.kolegend .kl.on{border-color:var(--gold);background:rgba(90,60,10,.95);transform:scale(1.06)}
.kolegend.mid{position:absolute;left:24%;right:24%;bottom:3%;z-index:6}.kolegend.mid .kl{font-size:1.25cqw;padding:.4cqw .6cqw}
.kolegend.big{margin:0 auto;width:82%}.kolegend.big .kl{font-size:2cqw}
.kodraw{display:grid;grid-template-columns:1fr auto 1fr;gap:2cqw;align-items:center;flex:1;margin-top:.6cqw}.kovs{font-family:var(--display);font-size:5cqw;color:var(--gold)}
.kodraw .rbox.dz{border-color:var(--red);background:rgba(60,10,28,.9)}
.kocard{position:absolute;top:10cqw;z-index:8;width:22cqw;background:rgba(10,13,38,.93);border:.25cqw solid var(--line);border-radius:1.2cqw;padding:.7cqw 1cqw;display:grid;gap:.2cqw;text-align:center;transition:all .4s}
.kocard.a{left:6%}.kocard.d{right:6%}.kocard span{font-family:var(--util);font-weight:800;letter-spacing:.2cqw;font-size:1.2cqw;color:var(--muted)}
.kocard b{font-family:var(--display);font-weight:400;font-size:2.2cqw}.kocard em{font-style:normal;font-weight:700;font-size:1.4cqw;color:#cfd3e6}
.kocard.lock{border-color:var(--lime)}.kocard.rev{transform:scale(1.12);border-color:var(--gold)}.kocard.rev em strong{display:block;font-family:var(--display);font-weight:400;font-size:2.6cqw;color:var(--gold)}.kocard.rev em small{font-size:1.4cqw;font-weight:800}
.kocard.good{border-color:var(--lime)}.kocard.good em small{color:var(--lime)}.kocard.bad{border-color:var(--red)}.kocard.bad em small{color:var(--red)}
.zband{position:absolute;left:0;right:0;height:6cqw;transform:translateY(-50%);z-index:3;background:linear-gradient(90deg,transparent,rgba(255,61,110,.35) 20%,rgba(255,61,110,.5) 70%,transparent);border-top:.2cqw dashed rgba(255,200,210,.8);border-bottom:.2cqw dashed rgba(255,200,210,.8);animation:zb .9s ease-in-out infinite alternate}
.zband span{position:absolute;right:2%;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:2.6cqw;color:#fff;-webkit-text-stroke:.1cqw var(--ink)}
@keyframes zb{to{opacity:.55}}
.streak{position:absolute;width:14cqw;height:2.2cqw;margin-top:-1.1cqw;z-index:7;border-radius:2cqw;background:linear-gradient(90deg,transparent,rgba(255,207,63,.5) 40%,#fff 92%,#fff);box-shadow:0 0 2cqw #ffcf3f;transform:translateX(-100%)}
.shield2{position:absolute;left:-8%;top:18%;width:55%;height:55%;z-index:6;background:radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.85),rgba(0,159,219,.55) 45%,rgba(0,87,184,.2) 70%);border:.3cqw solid #8eeeff;border-radius:40% 40% 50% 50%;animation:shield 1.6s forwards}
.tv.slowmo .actor{transition:none}
.rk3{font-family:var(--display);font-size:2.4cqw;color:var(--gold)}
/* closest number: guesses sit above and below one line */
.nline{top:56%;bottom:auto}
.ndot{position:absolute;width:.9cqw;height:.9cqw;margin:-.45cqw 0 0 -.45cqw;border-radius:50%;background:#fff;z-index:4}
.npin{animation:drop .45s cubic-bezier(.2,1.6,.4,1)}.npin.dn{grid-auto-flow:row}.npin.dn b{order:-1}
.npin b{font-size:1.2cqw;background:rgba(10,13,38,.85);border-radius:.6cqw;padding:0 .4cqw}
.ansmark{top:20%;bottom:auto;height:78%}
/* falling answers: wrap long answers so they always fit their lane */
.drop{white-space:normal;max-width:22%;width:max-content;text-align:center;line-height:1.1;font-size:1.9cqw;padding:.8cqw 1.2cqw}
/* phone: answers fall in each lane */
.flanes button{position:relative;justify-content:flex-end;overflow:hidden}
.flanes .ftag{position:absolute;left:3px;right:3px;width:auto;top:4px;animation:pfall var(--fs,20s) linear forwards}
@keyframes pfall{from{transform:translateY(0)}to{transform:translateY(calc(var(--fh,30vh) - 100%))}}
.flanes .fme{min-height:64px}
/* phone knockout pads */
.atk{flex:1;display:grid;gap:8px}
.atk button{border:3px solid var(--line);border-radius:16px;background:var(--panel-2);color:#fff;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:10px 14px}
.atk button i{font-style:normal;font-size:34px;grid-row:span 2}.atk button b{font-family:var(--display);font-weight:400;font-size:22px}.atk button small{color:var(--muted);font-size:13px;font-weight:700}
.atk button.sel{border-color:var(--gold);background:#3a2a0a}.atk.locked button:not(.sel){opacity:.35}
.klg{display:grid;gap:4px;font-weight:800;font-size:14px;background:var(--panel);border-radius:12px;padding:8px 10px}.klg div{display:flex;justify-content:space-between}.klg em{font-style:normal;color:var(--lime)}
.phpause{position:fixed;inset:0;z-index:80;display:grid;place-content:center;justify-items:center;gap:6px;background:rgba(7,10,34,.8);backdrop-filter:blur(3px)}
.phpause b{font-family:var(--display);font-size:44px;color:var(--gold)}.phpause span{font-weight:700}

.flab span.flip{transform:translateY(-50%) rotate(180deg)}
.crest{top:3%;width:10cqw;grid-auto-flow:row}.crest span{order:-1;font-size:1.4cqw;background:rgba(10,13,38,.75);border-radius:99px;padding:.2cqw .8cqw;white-space:nowrap}
.hbx{display:none;gap:6px}.hostbar:hover .hbx,body.mouse .hbx,body.paused .hbx{display:flex}
.hostbar[data-mode="game"]{opacity:.7}

.kocard{top:8cqw}.atk button{align-content:center}

.nlead{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.nlead line{stroke:rgba(255,255,255,.45);stroke-width:1.5;vector-effect:non-scaling-stroke}
.ansmark{top:48%;height:16%}.ansmark b{top:auto;bottom:-3.6cqw;font-size:2.6cqw;background:rgba(10,13,38,.9);border-radius:.8cqw;padding:0 .8cqw}
.npin.dn b{order:0}

/* v1.6 pause: the paused screen stays fully visible so the host can talk over it */
.pauseov{inset:auto;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,13,38,.9);backdrop-filter:none;border:2px solid var(--gold);border-radius:99px;padding:6px 22px}
.pauseov b{font-size:clamp(16px,2.2vw,28px);-webkit-text-stroke:0}
.phpause{inset:auto;left:50%;top:8px;transform:translateX(-50%);background:rgba(10,13,38,.92);backdrop-filter:none;border:2px solid var(--gold);border-radius:99px;padding:4px 16px;display:flex;gap:8px;align-items:center}
.phpause b{font-size:18px}.phpause span{font-size:12px}
/* v1.6 Dance-Off: dancers keep grooving on the beat (123 BPM) between moves */
.dancer.groove .fig:not([class*="mv-"]) svg{animation:gvB .975s ease-in-out infinite;transform-origin:50% 100%}
.dancer.groove .fig:not([class*="mv-"]) .j-armL{animation:gvAL .975s ease-in-out infinite}.dancer.groove .fig:not([class*="mv-"]) .j-armR{animation:gvAR .975s ease-in-out infinite}
.dancer.groove .fig:not([class*="mv-"]) .j-foreL{animation:gvFL .975s ease-in-out infinite}.dancer.groove .fig:not([class*="mv-"]) .j-foreR{animation:gvFR .975s ease-in-out infinite}
.dancer.groove .fig:not([class*="mv-"]) .j-legL{animation:gvLL .975s ease-in-out infinite}.dancer.groove .fig:not([class*="mv-"]) .j-legR{animation:gvLR .975s ease-in-out infinite}
@keyframes gvB{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(3%) scaleY(.97)}}
@keyframes gvAL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(55deg)}}@keyframes gvAR{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(-30deg)}}
@keyframes gvFL{0%,100%{transform:rotate(-80deg)}50%{transform:rotate(-40deg)}}@keyframes gvFR{0%,100%{transform:rotate(40deg)}50%{transform:rotate(80deg)}}
@keyframes gvLL{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}@keyframes gvLR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(0)}}
.crest{width:12cqw}.crest.r{right:1%}.crest.l{left:1%}.crest .tcrest{width:10cqw}.crest span{white-space:normal;font-size:1.3cqw}
.phpause span{display:none}

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }

            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

function cueTimes(lyr,o){const out=[];o=o||0;let r=0;const pool=DMOVES.map(x=>x[0]).filter(x=>x!=='flip');lyr.forEach((l,i)=>{const next=lyr[i+1]?lyr[i+1].s:l.s+4.5;const span=Math.max(1.2,next-l.s);const n=Math.max(arr(l.m).length,Math.round(span/1.95));
  for(let j=0;j<n;j++){const m=arr(l.m)[j]||pool[(r++)%pool.length];out.push({m,t:Math.round((l.s+span*(j+.45)/n)*1000)+o})}});return out}

/* Pack n standing fighters into a box (x, y, w, h in percent of the screen) so every face stays visible:
   columns never overlap, and each row behind shows the full head above the row in front. */
function packPos(n,box,max){const W=box.w,H=box.h*.5625;let f=Math.min(max||8,W);
  const fit=f=>{const cw=f*.74,fh=f*1.4,rh=fh*.52;const cols=Math.max(1,Math.min(n,Math.floor(W/cw)));const rows=Math.ceil(n/cols);return {cw,fh,rh,cols,rows,h:fh+(rows-1)*rh}};
  let L=fit(f);while(f>1.8&&(L.h>H||L.cols*L.cw>W+.01)){f-=.15;L=fit(f)}
  const pos=[];for(let i=0;i<n;i++){const r=Math.floor(i/L.cols),c=i%L.cols;const inRow=r===L.rows-1?n-r*L.cols:L.cols;const x0=box.x+(W-inRow*L.cw)/2;
    const top=box.y*.5625+(H-L.h)+r*L.rh;pos.push({x:x0+c*L.cw+(L.cw-f)/2,y:top/.5625,z:10+r})}return {f,pos}}

async function startGame(){
  if(G.running)return;const ps=P().filter(p=>p.head);if(ps.length<2){alert0('At least 2 fighters are needed.');return}
  SND.init();G.running=true;G.paused=false;G.ko=0;G.roundNo=0;G.finalPips={};G.eliminatedOrder=[];G.teamsDone={};G.usedFins=[];G.seen={};G.tw=0;G.lastTwist='';G.usedTw=[];G.usedExits=[];G.duelUsed=[];G.pending={};
  P().forEach(p=>{p.score=0;p.ghost=false;p.out=0;p.team=''});
  const sh=shuffle(P());sh.forEach((p,i)=>p.team=i%2?'blue':'red');
  showHostBar('game');
  try{await runGame()}catch(e){if(e.message!=='stopped')console.error(e)}

function alert0(t){const m=$('hMsg');if(m){m.textContent=t;m.hidden=false;setTimeout(()=>m.hidden=true,4000)}}
async function runGame(){
  const S=SET();
  await sceneTeams();
  const rounds=qList().filter(q=>(q.role||'round')==='round'&&qValid(q));
  const warm=Math.min(S.warmup,rounds.length);
  let tugDone=!S.tug,danceDone=!S.dance,cbDone=!S.comeback;
  for(let i=0;i<rounds.length;i++){
    if(alive().length<=3&&i>=warm)break;
    G.roundNo=i+1;const isWarm=i<warm;
    await playQuestion(rounds[i],{warm:isWarm,label:isWarm?'WARM-UP':'ROUND '+(i+1-warm+ (warm?0:0)),n:i+1,of:rounds.length});
    if(!isWarm){
      await board({cut:0,twist:1});
      const tw=await wheelOfFate(i===rounds.length-1);if(tw)await runTwist(tw);G.tw++;
    } else await board({cut:0,warm:true});
    const betNext=!!(G.pending&&G.pending.bets)&&i<rounds.length-1;
    if(!betNext&&!tugDone&&(G.tw>=S.tugAfterKO||i===rounds.length-1)){tugDone=true;await tug()}
    if(!betNext&&!danceDone&&(G.tw>=S.danceAfterKO||i===rounds.length-1)){danceDone=true;await dance()}
    if(!betNext&&!cbDone&&G.tw>=S.comebackAfterKO&&ghosts().length>S.comebackSpots){cbDone=true;await comeback()}
  }
  if(!tugDone){await tug()}
  if(!danceDone){await dance()}
  let fin=alive().slice().sort((a,b)=>b.score-a.score);
  if(fin.length>3){fin.slice(3).forEach(p=>{p.ghost=true;G.eliminatedOrder.push(p.id)});fin=fin.slice(0,3);await topThree(fin)}
  if(fin.length>=2)await finalFaceOff(fin);
  await champion(fin);
}

function speedBonus(ms,secs){const S=SET();return Math.max(0,Math.round(S.speed*(1-ms/(secs*1000))))}
function scoreQuestion(Q){const q=Q.q,fmt=Q.fmt,res={};const half=SET().ghostHalf;
  P().forEach(p=>{const a=Q.answers[p.id];let pts=0,ok=false,val=null;
    if(fmt==='number'){if(a&&a.v!=null){val=+a.v;const d=Math.abs(val-(+q.num));const t1=Math.max(2,Math.round(+q.num*.05)),t2=Math.max(5,Math.round(+q.num*.15));pts=d===0?15:d<=t1?10:d<=t2?5:1;ok=d<=t1}}
    else if(fmt==='falling'){if(a&&a.moved){const opt=Q.extra.lanes.end.indexOf(a.lane);val=opt;ok=opt===q.correct;pts=ok?10+speedBonus(a.ms||0,Q.secs):1}}
    else{if(a&&a.a!=null){val=a.a;ok=+a.a===+q.correct;pts=ok?10+speedBonus(a.ms||0,Q.secs):1}}
    if(p.ghost&&half)pts=Math.ceil(pts/2);

    if(fmt==='falling'){const end=Q.extra.lanes.end,start=Q.extra.lanes.start;const target=right?end[q.correct]:end[wrongOpt()];const early=start[right?q.correct:wrongOpt()];

    const t=900+Math.random()*ms*.7;HT(()=>setBotInput(p,{r:Q.r,a:right?+q.correct:wrongOpt(),ms:t}),t)})}

/* ---------------- knockout (v1.5: rock-paper-scissors simple) ----------------
   1. Short rules card: DUCK beats HIGH, BLOCK beats MIDDLE, JUMP beats LOW.
   2. A random safe player is drawn as the attacker (lower scores have better odds).
   3. On their phones, at the same time and in secret: the attacker taps HIGH, MIDDLE or LOW,
      the lowest score taps DUCK, BLOCK or JUMP.
   4. Showdown in slow motion: the attack is shown as a glowing band at head, body or leg height,
      the defence is shown, then the move plays. Right defence: safe (+5). Wrong or none: knocked out (attacker +10). */
function pickAttacker(safe){const sorted=safe.slice().sort((a,b)=>b.score-a.score);const w=sorted.map((p,i)=>i+1);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<sorted.length;i++){r-=w[i];if(r<=0)return sorted[i]}return sorted[sorted.length-1]}
const KO_RULES={n:'Knockout',say:'Knockout!',icon:'&#129354;',do:['A random player attacks: HIGH, MIDDLE or LOW','The lowest score defends: DUCK, BLOCK or JUMP','Right defence: safe. Wrong: knocked out'],why:''};
function koLegend(cls){return `<div class="kolegend ${cls||''}">${Object.keys(ATTACKS).map(k=>{const A=ATTACKS[k];return `<div class="kl" data-k="${k}"><span class="z">${A.zone}</span><b>${A.ic} ${A.n}</b><i>&#8594;</i><em>${DEFS[A.def].ic} ${DEFS[A.def].n}</em></div>`}).join('')}</div>`}
async function knockout(cut){const S=SET();const victims=G.danger.map(id=>G.players[id]).filter(Boolean).slice(0,1);if(!victims.length)return;const v0=victims[0];
  const safe=alive().filter(p=>p.id!==v0.id);if(!safe.length){v0.ghost=true;G.eliminatedOrder.push(v0.id);return}
  await howTo('ko',null,null,Object.assign({},KO_RULES,{why:`${v0.n} has the lowest score and defends.`,legend:1}));

  HT(()=>moveClass(tv.querySelector('#c1 .fig'),'mv-jump',800),4500);HT(()=>moveClass(tv.querySelector('#c1 .fig'),'mv-disco',900),6200);

async function saveSet(o){const cur=Object.assign({},DATA.settings||{});Object.assign(cur,o);await NET.set('data/settings',cur)}
function koTable(rounds,S){const warm=Math.min(S.warmup,rounds);const kr=Math.max(0,rounds-warm);return [20,25,30].map(n=>{let alive=n,cb=!S.comeback,ko=0;const cuts=[];for(let i=0;i<kr;i++){const left=kr-i;const need=alive-3+(cb?0:S.comebackSpots);let c=Math.ceil(Math.max(0,need)/Math.max(1,left));c=clamp(c,0,Math.max(0,alive-3));alive-=c;cuts.push(c);if(c)ko++;if(!cb&&ko>=S.comebackAfterKO){cb=true;alive+=S.comebackSpots;cuts.push('+'+S.comebackSpots)}}return `<tr><td>${n}</td><td>${cuts.map(c=>String(c).startsWith('+')?`<b class="ok">${c} back</b>`:`${c} out`).join(' &middot; ')||'No knockouts'}</td><td>${alive} to the final</td></tr>`}).join('')}

function route(){const h=(location.hash||'').replace('#','');const r=h.startsWith('play')?'play':h.startsWith('host')?'host':h.startsWith('admin')?'admin':'home';
  if(ROUTE&&ROUTE!==r){location.reload();return}ROUTE=r;
  if(r==='play')phonePage();else if(r==='host')hostPage();else if(r==='admin')adminPage();else homePage()}
window.addEventListener('hashchange',route);
document.addEventListener('pointerdown',()=>SND.init(),{once:true});
route();

</script>
